server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: vehicle-reservation-backend

  datasource:
    url: jdbc:mysql://localhost:3306/vehicle_reservation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  jackson:
    date-format: yyyy-MM-dd
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    allowed-origins: "http://localhost,http://127.0.0.1,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8081,http://localhost:63342"
  security:
    jwt:
      # Demo secret for coursework/local evaluation only - rotate before any real deployment.
      secret: "CIS6003AdvancedProgrammingSunriseVehicleReservationSystemSecretKeyForJwtSigning2026"
      expiration-ms: 3600000        # 1 hour
      cookie-name: vrs_token
  business:
    tax-rate: 0.08                  # 8% government tax applied to every bill
    weekend-surcharge-rate: 0.10    # 10% surcharge for Fri/Sat/Sun pickup
    long-term-discount-days: 7      # rentals >= 7 days qualify for a discount
    long-term-discount-rate: 0.15   # 15% discount for long-term rentals
    currency-symbol: "Rs."

logging:
  level:
    root: INFO
    com.sunrise.vehiclereservation: DEBUG
  file:
    name: logs/vehicle-reservation.log

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
