    <link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark navbar-sunrise no-print">
    <div class="container-fluid">
        <a class="navbar-brand navbar-brand-custom" href="dashboard.html">Sunrise Vehicle Rentals</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="reservations.html">Reservations</a></li>
                <li class="nav-item"><a class="nav-link" href="vehicles.html">Vehicles</a></li>
                <li class="nav-item"><a class="nav-link" href="customers.html">Customers</a></li>
                <li class="nav-item"><a class="nav-link" href="reports.html">Reports</a></li>
                <li class="nav-item" data-role-admin-only><a class="nav-link" href="users.html">Staff Accounts</a></li>
                <li class="nav-item"><a class="nav-link" href="help.html">Help</a></li>
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item text-white-50 small me-lg-3"><span id="navUserName"></span> (<span id="navUserRole"></span>)</li>
                <li class="nav-item"><a class="btn btn-outline-light btn-sm" href="#" id="logoutBtn">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container-fluid px-4 py-4">
    <h1 class="h4 section-title mb-3">Staff Accounts</h1>
    <div id="alertBox"></div>

    <div id="accessDenied" class="alert alert-warning d-none">
        Only administrators can manage staff accounts.
    </div>

    <div id="adminContent" class="row g-3 d-none">
        <div class="col-lg-7">
            <div class="card p-3">
                <h2 class="h6 section-title">All Staff</h2>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead><tr><th>Username</th><th>Full Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead>
                        <tbody id="usersBody"><tr><td colspan="6" class="text-muted">Loading...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card p-3">
                <h2 class="h6 section-title">Add Staff Account</h2>
                <div id="formAlert"></div>
                <form id="userForm">
                    <div class="mb-2">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" required>
                        <div class="field-error" id="err-username"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Temporary Password</label>
                        <input type="text" class="form-control" id="password" required>
                        <div class="field-error" id="err-password"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" required>
                        <div class="field-error" id="err-fullName"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                        <div class="field-error" id="err-email"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Role</label>
                        <select class="form-select" id="role">
                            <option value="STAFF">STAFF</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-brand w-100">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</main>

<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/users.js"></script>
</body>
</html>
