name: Backend CI

on:
  push:
    branches: [ "main", "develop", "feature/**" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VehicleReservationSystem/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build (compile)
        run: ./mvnw -B -q compile

      - name: Run automated test suite (JUnit 5 + Mockito, H2 in-memory DB)
        run: ./mvnw -B test

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: VehicleReservationSystem/backend/target/surefire-reports/

      - name: Package (skip tests - already run above)
        run: ./mvnw -B -q package -DskipTests

      - name: Publish backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-reservation-backend-jar
          path: VehicleReservationSystem/backend/target/*.jar
